[project]
name = "teacher-agent-backend"
version = "0.1.0"
description = "TeacherAgent backend - grounded learning assistant (FastAPI + LangGraph)"
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "sse-starlette>=2.1",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "redis>=5.2",
    "arq>=0.26",
    "pyjwt>=2.10",
    "pwdlib[argon2]>=0.2.1",
    "langchain>=1.0,<2",
    "langchain-core>=1.0,<2",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-postgres>=2.0.2",
    "psycopg[binary,pool]>=3.2",
    "httpx[socks]>=0.27",
    "structlog>=24.4",
    "rank-bm25>=0.2.2",
    "langdetect>=1.0.9",
    "opentelemetry-api>=1.38,<2",
    "opentelemetry-sdk>=1.38,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.38,<2",
    "opentelemetry-instrumentation-fastapi>=0.59b0,<1",
    "opentelemetry-instrumentation-httpx>=0.59b0,<1",
    "opentelemetry-instrumentation-sqlalchemy>=0.59b0,<1",
]

[project.optional-dependencies]
openai = ["langchain-openai>=1.0,<2"]
anthropic = ["langchain-anthropic>=1.0,<2"]
ollama = ["langchain-ollama>=1.0,<2"]
ingestion = [
    "markitdown[docx,pptx,xlsx,pdf]>=0.0.1a3",
    "beautifulsoup4>=4.12",
    "trafilatura>=1.12",
    "gitpython>=3.1.43",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
